services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doomsday-ready-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DB_PATH=/app/data/doomsday.db
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doomsday-ready-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
